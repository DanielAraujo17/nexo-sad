<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#eef3f8"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#244c7a"/><stop offset="1" stop-color="#142b45"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d9a8b"/><stop offset="1" stop-color="#14766c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1c334e" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#7790a7"/></marker>
    <style>
      .h{font:700 28px 'Segoe UI',Arial;fill:#1a3049}.sub{font:14px 'Segoe UI',Arial;fill:#6f8194}.boxTitle{font:700 18px 'Segoe UI',Arial;fill:#20364f}.body{font:13px 'Segoe UI',Arial;fill:#667a90}.white{fill:#fff}.mini{font:700 11px 'Segoe UI',Arial;letter-spacing:1.4px;fill:#5e8f89}
    </style>
  </defs>
  <rect width="1200" height="820" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" class="h">Arquitetura do Nexo — SAD para priorização de chamados</text>
  <text x="600" y="82" text-anchor="middle" class="sub">Aplicação Flask · funções analíticas em Python · histórico persistente de chamados</text>

  <rect x="390" y="115" width="420" height="88" rx="16" fill="url(#navy)" filter="url(#shadow)"/>
  <text x="600" y="151" text-anchor="middle" class="white" style="font:700 20px 'Segoe UI',Arial">Usuário / Navegador</text>
  <text x="600" y="177" text-anchor="middle" class="white" style="font:13px 'Segoe UI',Arial;opacity:.85">Site responsivo em HTML, CSS e JavaScript</text>

  <path d="M600 203 V248" stroke="#7790a7" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <rect x="390" y="255" width="420" height="100" rx="16" fill="#fff" stroke="#dce5ed" filter="url(#shadow)"/>
  <text x="600" y="292" text-anchor="middle" class="boxTitle">Flask · Servidor web</text>
  <text x="600" y="318" text-anchor="middle" class="body">Rotas, formulários, sessões e fluxo dos chamados</text>

  <path d="M600 355 V400 H280 V445" stroke="#7790a7" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M600 400 H920 V445" stroke="#7790a7" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>

  <rect x="75" y="452" width="410" height="178" rx="16" fill="#fff" stroke="#dce5ed" filter="url(#shadow)"/>
  <rect x="75" y="452" width="410" height="12" rx="6" fill="url(#teal)"/>
  <text x="280" y="497" text-anchor="middle" class="boxTitle">Motor analítico</text>
  <text x="280" y="526" text-anchor="middle" class="body">Pandas · NumPy · scikit-learn</text>
  <rect x="104" y="550" width="352" height="55" rx="9" fill="#eff7f5"/>
  <text x="280" y="573" text-anchor="middle" class="body" style="font-weight:700;fill:#28786d">Sumarização · K-Means · Árvore de decisão</text>
  <text x="280" y="591" text-anchor="middle" class="body">Pontuação ponderada e validação</text>

  <rect x="715" y="452" width="410" height="178" rx="16" fill="#fff" stroke="#dce5ed" filter="url(#shadow)"/>
  <rect x="715" y="452" width="410" height="12" rx="6" fill="#477da8"/>
  <text x="920" y="497" text-anchor="middle" class="boxTitle">Banco de dados</text>
  <text x="920" y="526" text-anchor="middle" class="body">PostgreSQL no Supabase · SQLite local</text>
  <rect x="744" y="550" width="352" height="55" rx="9" fill="#edf4fa"/>
  <text x="920" y="573" text-anchor="middle" class="body" style="font-weight:700;fill:#365f83">Uma única tabela: chamados</text>
  <text x="920" y="591" text-anchor="middle" class="body">Abertos + resolvidos · retenção dos últimos 200</text>

  <path d="M280 630 V676 H600 V710" stroke="#7790a7" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M920 630 V676 H600" stroke="#7790a7" stroke-width="2.5" fill="none"/>
  <rect x="320" y="716" width="560" height="72" rx="14" fill="#e8f5f2" stroke="#cde7df"/>
  <text x="600" y="746" text-anchor="middle" class="boxTitle" style="fill:#176b60">Recomendação de atendimento</text>
  <text x="600" y="769" text-anchor="middle" class="body">Fila priorizada · explicação dos critérios · histórico atualizado</text>
</svg>
